[project]
name = "logsentinel"
version = "0.1.0"
description = "Lightweight brute-force and credential-stuffing detector for auth logs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ronald Samuel" }]
dependencies = []

[project.scripts]
logsentinel = "logsentinel.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logsentinel*"]
